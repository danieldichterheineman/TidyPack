# Builds Tidy Pack and uploads it to CurseForge when a version tag is pushed,
# e.g. v1.0.1. Uses BigWigs packager: https://github.com/BigWigsMods/packager
#
# Only "clean" version tags (vN.N.N) start the workflow. Test versions like
# v1.0.1-alpha1 are added by hand as pre-releases under Releases on GitHub and
# aren't uploaded to CurseForge (see AGENTS.md, section Publishing).
name: Package and release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Lets the workflow create a release with the zip file on GitHub.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      # The CurseForge key, which the owner added as a secret in the repository.
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      # Created automatically by GitHub – doesn't need to be added.
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history, so the packager finds the previous tag

      # The version in TidyPack.toc is a fixed number. If it doesn't match the tag, the run
      # stops before anything is uploaded, so players never get a wrong version number.
      - name: Check that the tag matches the version in the TOC file
        id: version
        run: |
          toc_version=$(grep -m1 '^## Version:' TidyPack.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
          if [ "v${toc_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::The tag is ${GITHUB_REF_NAME}, but TidyPack.toc says version ${toc_version}. Nothing was uploaded."
            exit 1
          fi
          echo "version=${toc_version}" >> "$GITHUB_OUTPUT"

      # -u: Unix line endings (LF), the same as the files you try in the game. Otherwise the packager
      # writes Windows line endings (CRLF), which the game reads too but which makes the files differ.
      # -n "file name:display name": the zip file is TidyPack-1.0.1.zip and the file shows as
      # "TidyPack-1.0.1" on CurseForge (the packager swaps spaces for underscores). Without -n the name is the tag and the game type ("v1.0.1-forever").
      - name: Package and release
        uses: BigWigsMods/packager@v2
        with:
          args: -u -n "TidyPack-${{ steps.version.outputs.version }}:TidyPack-${{ steps.version.outputs.version }}"
