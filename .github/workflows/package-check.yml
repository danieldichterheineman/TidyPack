# A test build of the zip file without uploading anything. Started by hand: Actions → Package check
# (no upload) → Run workflow. Builds the package with BigWigs packager (the flag -d skips
# the upload, and no key is sent along), prints what is included and keeps
# the zip file as a downloadable file on the run.
name: Package check (no upload)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history, as in the real workflow

      - name: Read the version from the TOC file
        id: version
        run: |
          toc_version=$(grep -m1 '^## Version:' TidyPack.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
          echo "version=${toc_version}" >> "$GITHUB_OUTPUT"

      # -d: no upload, -u: Unix line endings (LF), -n: the same name as in the release.
      - name: Build the package without uploading
        uses: BigWigsMods/packager@v2
        with:
          args: -d -u -n "TidyPack-${{ steps.version.outputs.version }}:TidyPack-${{ steps.version.outputs.version }}"

      - name: List what is in the package
        run: |
          ls -la .release
          for zip in .release/*.zip; do
            echo "== $zip"
            unzip -l "$zip"
          done

      - name: Keep the zip file
        uses: actions/upload-artifact@v7
        with:
          name: TidyPack-package-check
          path: .release/*.zip
          retention-days: 7
          # .release is a hidden folder, and hidden folders are skipped otherwise
          include-hidden-files: true
